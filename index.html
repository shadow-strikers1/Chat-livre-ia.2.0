<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d16">
<meta name="description" content="Chat livre com inteligência artificial.">
<title>Chat Livre AI</title>
<style>
  :root{
    --bg:#0b0d16;
    --header-bg:#10121c;
    --composer-bg:#10121c;
    --surface:#12141f;
    --bubble-ai:#171a28;
    --border:#242840;
    --text:#e9ebf6;
    --text-dim:#8c92b3;
    --text-faint:#565c80;
    --accent-1:#7c5cfc;
    --accent-2:#4c8dff;
    --accent-grad:linear-gradient(135deg,var(--accent-1),var(--accent-2));
    --danger:#e5586a;
    --danger-bg:#2a1620;
    --online:#3ddc97;
    --offline:#6b7094;
    --radius-lg:18px;
    --radius-sm:4px;
    --shadow-soft:0 10px 30px rgba(4,6,14,0.4);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  body{
    background-image:
      radial-gradient(circle at 15% -10%, rgba(124,92,252,0.14), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(76,141,255,0.10), transparent 45%);
    background-attachment:fixed;
  }

  button{ font-family:inherit; }

  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    max-width:720px;
    margin:0 auto;
    position:relative;
  }

  /* Header */
  .app-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
    background:var(--header-bg);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:10;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
  }

  .brand-mark{
    width:30px;
    height:30px;
    border-radius:9px;
    background:var(--accent-grad);
    flex-shrink:0;
    position:relative;
    box-shadow:0 4px 14px rgba(124,92,252,0.35);
  }

  .brand-mark::after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    top:7px;
    left:7px;
  }

  .brand-name{
    font-weight:600;
    font-size:1.02rem;
    letter-spacing:-0.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .status{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.78rem;
    color:var(--text-dim);
    flex-shrink:0;
  }

  .status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--offline);
    transition:background-color 0.2s ease;
  }

  .status-dot.online{ background:var(--online); box-shadow:0 0 8px rgba(61,220,151,0.6); }
  .status-dot.offline{ background:var(--offline); }

  .clear-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:36px;
    height:36px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
    flex-shrink:0;
    transition:background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .clear-btn:hover{ background:rgba(255,255,255,0.04); color:var(--text); border-color:var(--accent-2); }
  .clear-btn:active{ transform:scale(0.96); }

  /* Chat area */
  .chat-area{
    flex:1;
    overflow-y:auto;
    padding:20px 16px 12px;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }

  .empty-state{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    padding:0 24px;
    color:var(--text-dim);
  }

  .empty-mark{
    width:56px;
    height:56px;
    border-radius:16px;
    background:var(--accent-grad);
    box-shadow:0 12px 30px rgba(124,92,252,0.3);
    position:relative;
  }

  .empty-mark::after{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    top:13px;
    left:13px;
  }

  .empty-state h1{
    font-size:1.3rem;
    margin:0;
    color:var(--text);
    font-weight:600;
    letter-spacing:-0.01em;
  }

  .empty-state p{
    margin:0;
    font-size:0.92rem;
    max-width:280px;
    line-height:1.5;
  }

  .messages{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .bubble-row{
    display:flex;
    width:100%;
  }

  .bubble-row.user{ justify-content:flex-end; }
  .bubble-row.assistant{ justify-content:flex-start; }

  .bubble{
    max-width:82%;
    padding:11px 14px;
    font-size:0.95rem;
    line-height:1.55;
    animation:rise 0.18s ease-out;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .bubble.user{
    background:var(--accent-grad);
    color:#fff;
    border-radius:var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-lg);
  }

  .bubble.assistant{
    background:var(--bubble-ai);
    border:1px solid var(--border);
    border-radius:var(--radius-lg) var(--radius-lg) var(--radius-lg) var(--radius-sm);
  }

  .bubble.assistant.error{
    background:var(--danger-bg);
    border-color:rgba(229,88,106,0.4);
    color:#f3c7cd;
  }

  .bubble-text p{ margin:0 0 8px; }
  .bubble-text p:last-child{ margin-bottom:0; }
  .bubble-text br{ display:block; margin-top:4px; }

  .bubble-text ul,.bubble-text ol{ margin:0 0 8px; padding-left:20px; }
  .bubble-text ul:last-child,.bubble-text ol:last-child{ margin-bottom:0; }
  .bubble-text li{ margin-bottom:4px; }

  .bubble-text code{
    font-family:var(--font-mono);
    background:rgba(255,255,255,0.08);
    padding:0.15em 0.4em;
    border-radius:4px;
    font-size:0.87em;
  }

  .bubble-text pre{
    background:rgba(0,0,0,0.28);
    border:1px solid rgba(255,255,255,0.06);
    padding:12px;
    border-radius:10px;
    overflow-x:auto;
    margin:0 0 8px;
  }

  .bubble-text pre code{
    background:none;
    padding:0;
    font-size:0.83em;
    line-height:1.5;
  }

  .bubble-meta{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:6px;
    min-height:16px;
  }

  .bubble-time{
    font-size:0.7rem;
    color:var(--text-faint);
  }

  .bubble.user .bubble-time{ color:rgba(255,255,255,0.75); }

  .copy-btn{
    border:none;
    background:none;
    color:var(--text-dim);
    font-size:0.72rem;
    cursor:pointer;
    padding:2px 0;
    transition:color 0.15s ease;
  }

  .copy-btn:hover{ color:var(--accent-2); }
  .copy-btn.copied{ color:var(--online); }

  /* Typing indicator */
  .bubble.typing{
    display:flex;
    align-items:center;
    gap:5px;
    padding:14px 16px;
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--text-dim);
    animation:blink 1.4s infinite ease-in-out;
  }

  .dot:nth-child(2){ animation-delay:0.2s; }
  .dot:nth-child(3){ animation-delay:0.4s; }

  @keyframes blink{
    0%,80%,100%{ opacity:0.25; transform:translateY(0); }
    40%{ opacity:1; transform:translateY(-3px); }
  }

  /* AI Selector */
  .mode-selector-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.015)}
  .mode-selector-label{font-size:12px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .mode-selector{flex:1;max-width:360px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:9px 12px;font:inherit;outline:none}
  .mode-selector:focus{border-color:var(--accent-2)}
  .image-result{max-width:min(520px,90vw);border-radius:16px;display:block;margin-top:8px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.22)}
  .image-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .image-actions a{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:10px;border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:12px;background:var(--panel)}

  .ai-selector-bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    background:var(--header-bg);
    border-bottom:1px solid var(--border);
  }

  .ai-selector-label{
    font-size:0.78rem;
    color:var(--text-dim);
    white-space:nowrap;
  }

  .ai-selector{
    flex:1;
    min-width:0;
    appearance:none;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--surface);
    color:var(--text);
    font-family:var(--font);
    font-size:0.84rem;
    padding:9px 34px 9px 12px;
    outline:none;
    cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);
    background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
    background-size:5px 5px,5px 5px;
    background-repeat:no-repeat;
  }

  .ai-selector:focus{ border-color:var(--accent); }

  .ai-current{
    font-size:0.72rem;
    color:var(--online);
    white-space:nowrap;
  }

  /* Composer */
  .composer{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
    background:var(--composer-bg);
    border-top:1px solid var(--border);
  }

  .composer-input{
    flex:1;
    resize:none;
    max-height:160px;
    min-height:44px;
    padding:11px 14px;
    border-radius:16px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:var(--font);
    font-size:0.95rem;
    line-height:1.4;
    outline:none;
    transition:border-color 0.15s ease;
  }

  .composer-input::placeholder{ color:var(--text-faint); }
  .composer-input:focus{ border-color:var(--accent-2); }

  .send-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:none;
    background:var(--accent-grad);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform 0.12s ease, opacity 0.12s ease;
  }

  .send-btn:active{ transform:scale(0.92); }
  .send-btn:disabled{ opacity:0.5; cursor:default; }

  /* Modal */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(6,7,13,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:20;
  }

  .modal-overlay[hidden]{
    display:none;
  }

  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    max-width:340px;
    width:100%;
    box-shadow:var(--shadow-soft);
  }

  .modal h2{
    margin:0 0 8px;
    font-size:1.05rem;
    font-weight:600;
  }

  .modal p{
    margin:0 0 18px;
    font-size:0.88rem;
    color:var(--text-dim);
    line-height:1.5;
  }

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }

  .btn-secondary,.btn-danger{
    padding:9px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    font-size:0.88rem;
    cursor:pointer;
  }

  .btn-secondary:hover{ background:rgba(255,255,255,0.05); }

  .btn-danger{
    background:var(--danger);
    border-color:var(--danger);
    color:#fff;
  }

  .btn-danger:hover{ opacity:0.9; }

  /* Foco visível (acessibilidade) */
  button:focus-visible,
  .composer-input:focus-visible{
    outline:2px solid var(--accent-2);
    outline-offset:2px;
  }

  /* Scrollbar (webkit) */
  .chat-area::-webkit-scrollbar{ width:6px; }
  .chat-area::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }

  @media (prefers-reduced-motion:reduce){
    .bubble{ animation:none; }
    .dot{ animation:none; opacity:0.6; }
  }

  @media (max-width:380px){
    .brand-name{ font-size:0.95rem; }
    .bubble{ max-width:88%; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Chat Livre AI</span>
      </div>
      <div class="status" id="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Conectado</span>
      </div>
      <button class="clear-btn" id="clearBtn" type="button" title="Limpar conversa" aria-label="Limpar conversa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 7H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M9 7V4.5C9 4.22386 9.22386 4 9.5 4H14.5C14.7761 4 15 4.22386 15 4.5V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 7L6.75 19.25C6.79 19.95 7.37 20.5 8.07 20.5H15.93C16.63 20.5 17.21 19.95 17.25 19.25L18 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 11V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M14 11V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="mode-selector-bar">
      <span class="mode-selector-label">Modo</span>
      <select id="modeSelector" class="mode-selector" aria-label="Escolher modo">
        <option value="chat">💬 Conversar</option>
        <option value="image">🎨 Gerar imagem</option>
      </select>
    </div>

    <div class="ai-selector-bar">
      <span class="ai-selector-label">IA</span>
      <select id="aiProvider" class="ai-selector" aria-label="Escolher inteligência artificial">
        <option value="gemini">✨ Gemini 3.6 Flash</option>
        <option value="openrouter">🌐 OpenRouter Free</option>
      </select>
      <span class="ai-current" id="aiCurrent">Online</span>
    </div>

    <main class="chat-area" id="chatArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark" aria-hidden="true"></div>
        <h1>Chat Livre AI</h1>
        <p>Converse livremente com a inteligência artificial.</p>
      </div>
      <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Histórico de mensagens" hidden></div>
    </main>

    <form class="composer" id="composerForm">
      <textarea
        id="messageInput"
        class="composer-input"
        placeholder="Escreva sua mensagem..."
        rows="1"
        maxlength="6000"
        autocomplete="off"
        autocapitalize="sentences"
        spellcheck="true"
        enterkeyhint="send"
        aria-label="Mensagem"
      ></textarea>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Enviar mensagem">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3.4 20.6L21 12 3.4 3.4 3.4 10.2 15 12 3.4 13.8 3.4 20.6Z" fill="currentColor"/>
        </svg>
      </button>
    </form>
  </div>

  <div class="modal-overlay" id="confirmOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Limpar conversa?</h2>
      <p>Isso vai apagar todo o histórico desta conversa. Essa ação não pode ser desfeita.</p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelClear">Cancelar</button>
        <button type="button" class="btn-danger" id="confirmClear">Limpar</button>
      </div>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var STORAGE_KEY = 'chatLivreAI.history.v1';
  var MAX_HISTORY_SEND = 40;
  var PROVIDER_KEY = 'chatLivreAI.provider.v1';
  var MODE_KEY = 'chatLivreAI.mode.v1';
  var selectedProvider = localStorage.getItem(PROVIDER_KEY) || 'gemini';
  var selectedMode = localStorage.getItem(MODE_KEY) || 'chat';

  var el = {
    chatArea: document.getElementById('chatArea'),
    emptyState: document.getElementById('emptyState'),
    messages: document.getElementById('messages'),
    form: document.getElementById('composerForm'),
    input: document.getElementById('messageInput'),
    sendBtn: document.getElementById('sendBtn'),
    clearBtn: document.getElementById('clearBtn'),
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    aiProvider: document.getElementById('aiProvider'),
    aiCurrent: document.getElementById('aiCurrent'),
    modeSelector: document.getElementById('modeSelector'),
    confirmOverlay: document.getElementById('confirmOverlay'),
    cancelClear: document.getElementById('cancelClear'),
    confirmClear: document.getElementById('confirmClear')
  };

  var history = loadHistory();
  var isSending = false;

  function loadHistory(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      if(!Array.isArray(parsed)) return [];
      return parsed.filter(function(m){
        return m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string';
      });
    }catch(e){
      return [];
    }
  }

  function saveHistory(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }catch(e){
      /* localStorage indisponível (modo privado ou cota excedida): segue apenas em memória */
    }
  }

  function escapeHtml(str){
    return str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function renderInline(text){
    text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    return text;
  }

  function renderMarkdownLite(raw){
    var escaped = escapeHtml(raw);
    var lines = escaped.split('\n');
    var html = '';
    var i = 0;

    while(i < lines.length){
      var trimmed = lines[i].trim();

      if(/^```/.test(trimmed)){
        var codeLines = [];
        i++;
        while(i < lines.length && !/^```/.test(lines[i].trim())){
          codeLines.push(lines[i]);
          i++;
        }
        i++;
        html += '<pre><code>' + codeLines.join('\n') + '</code></pre>';
        continue;
      }

      if(/^[-*]\s+/.test(trimmed)){
        var ulItems = [];
        while(i < lines.length && /^[-*]\s+/.test(lines[i].trim())){
          ulItems.push('<li>' + renderInline(lines[i].trim().replace(/^[-*]\s+/, '')) + '</li>');
          i++;
        }
        html += '<ul>' + ulItems.join('') + '</ul>';
        continue;
      }

      if(/^\d+\.\s+/.test(trimmed)){
        var olItems = [];
        while(i < lines.length && /^\d+\.\s+/.test(lines[i].trim())){
          olItems.push('<li>' + renderInline(lines[i].trim().replace(/^\d+\.\s+/, '')) + '</li>');
          i++;
        }
        html += '<ol>' + olItems.join('') + '</ol>';
        continue;
      }

      if(trimmed === ''){
        html += '<br>';
        i++;
        continue;
      }

      html += '<p>' + renderInline(lines[i]) + '</p>';
      i++;
    }

    return html;
  }

  function scrollToBottom(smooth){
    el.chatArea.scrollTo({ top: el.chatArea.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }

  function toggleEmptyState(){
    var hasMessages = history.length > 0;
    el.emptyState.hidden = hasMessages;
    el.messages.hidden = !hasMessages;
  }

  function formatTime(date){
    return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function createBubble(role, content, opts){
    opts = opts || {};

    var wrap = document.createElement('div');
    wrap.className = 'bubble-row ' + role;

    var bubble = document.createElement('div');
    bubble.className = 'bubble ' + role + (opts.isError ? ' error' : '');

    var textEl = document.createElement('div');
    textEl.className = 'bubble-text';
    textEl.innerHTML = renderMarkdownLite(content);
    bubble.appendChild(textEl);

    var meta = document.createElement('div');
    meta.className = 'bubble-meta';

    var time = document.createElement('span');
    time.className = 'bubble-time';
    time.textContent = formatTime(new Date());
    meta.appendChild(time);

    if(role === 'assistant' && !opts.isError){
      var copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = '📋 Copiar';
      copyBtn.addEventListener('click', function(){
        copyToClipboard(content, copyBtn);
      });
      meta.appendChild(copyBtn);
    }

    bubble.appendChild(meta);
    wrap.appendChild(bubble);
    el.messages.appendChild(wrap);
    return wrap;
  }

  function copyToClipboard(text, btn){
    var done = function(){
      btn.textContent = '✓ Copiado';
      btn.classList.add('copied');
      setTimeout(function(){
        btn.textContent = '📋 Copiar';
        btn.classList.remove('copied');
      }, 2000);
    };

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
    }else{
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){ /* ignora */ }
    document.body.removeChild(ta);
    done();
  }

  function showTyping(){
    var wrap = document.createElement('div');
    wrap.className = 'bubble-row assistant';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = '<div class="bubble assistant typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    el.messages.appendChild(wrap);
    scrollToBottom(true);
  }

  function hideTyping(){
    var node = document.getElementById('typingIndicator');
    if(node) node.remove();
  }

  function setSending(state){
    isSending = state;
    el.sendBtn.disabled = state;
    el.sendBtn.setAttribute('aria-busy', state ? 'true' : 'false');
  }

  function autoResize(){
    el.input.style.height = 'auto';
    var max = 160;
    el.input.style.height = Math.min(el.input.scrollHeight, max) + 'px';
  }

  function updateConnectionStatus(){
    var online = navigator.onLine;
    el.statusDot.classList.toggle('online', online);
    el.statusDot.classList.toggle('offline', !online);
    el.statusText.textContent = online ? 'Conectado' : 'Sem conexão';
  }

  function createImageBubble(prompt, imageData){
    var wrapper = document.createElement('div');
    wrapper.className = 'message-row assistant-row';

    var bubble = document.createElement('div');
    bubble.className = 'bubble assistant-bubble';

    var label = document.createElement('div');
    label.className = 'bubble-label';
    label.textContent = 'Imagem gerada';

    var img = document.createElement('img');
    img.className = 'image-result';
    img.alt = prompt;
    img.src = imageData.url || ('data:' + imageData.mimeType + ';base64,' + imageData.data);

    var actions = document.createElement('div');
    actions.className = 'image-actions';

    var link = document.createElement('a');
    link.href = img.src;
    link.download = 'chat-livre-ai.png';
    link.textContent = '⬇️ Salvar imagem';

    actions.appendChild(link);
    bubble.appendChild(label);
    bubble.appendChild(img);
    bubble.appendChild(actions);
    wrapper.appendChild(bubble);
    el.messages.appendChild(wrapper);
  }

  function sendMessage(text){
    history.push({ role: 'user', content: text });
    saveHistory();
    toggleEmptyState();
    createBubble('user', text);
    scrollToBottom(true);

    setSending(true);
    showTyping();

    var endpoint = selectedMode === 'image' ? '/api/image' : '/api/chat';
    var payload = selectedMode === 'image'
      ? { prompt: text }
      : { provider: selectedProvider, messages: history.slice(-MAX_HISTORY_SEND) };

    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function(response){
        return response.json().catch(function(){ return null; }).then(function(data){
          return { ok: response.ok, data: data };
        });
      })
      .then(function(result){
        hideTyping();

        if(!result.ok || !result.data){
          var message = result.data && result.data.error ? result.data.error : 'Não foi possível concluir a solicitação.';
          createBubble('assistant', message, { isError: true });
          scrollToBottom(true);
          return;
        }

        if(selectedMode === 'image'){
          if(!result.data.image || (!result.data.image.url && !result.data.image.data)){
            createBubble('assistant', 'A API não retornou uma imagem.', { isError: true });
            scrollToBottom(true);
            return;
          }
          createImageBubble(text, result.data.image);
          scrollToBottom(true);
          return;
        }

        if(typeof result.data.reply !== 'string'){
          createBubble('assistant', 'A IA não retornou uma resposta válida.', { isError: true });
          scrollToBottom(true);
          return;
        }

        history.push({ role: 'assistant', content: result.data.reply });
        saveHistory();
        createBubble('assistant', result.data.reply);
        scrollToBottom(true);
      })
      .catch(function(){
        hideTyping();
        createBubble('assistant', 'Não foi possível conectar à IA. Verifique sua conexão e tente novamente.', { isError: true });
        scrollToBottom(true);
      })
      .finally(function(){
        setSending(false);
        el.input.focus();
      });
  }

  function updateModeSelector(){
    if(!el.modeSelector) return;
    el.modeSelector.value = selectedMode;
    el.input.placeholder = selectedMode === 'image'
      ? 'Descreva a imagem que você quer criar...'
      : 'Escreva sua mensagem...';
    if(el.aiProvider) el.aiProvider.disabled = selectedMode === 'image';
    if(el.aiCurrent) el.aiCurrent.textContent = selectedMode === 'image' ? 'Pollinations' : (selectedProvider === 'gemini' ? 'Gemini' : 'OpenRouter');
  }

  function updateAISelector(){
    if(!el.aiProvider) return;
    el.aiProvider.value = selectedProvider;
    el.aiCurrent.textContent = selectedMode === 'image' ? 'Pollinations' : (selectedProvider === 'gemini' ? 'Gemini' : 'OpenRouter');
  }

  if(el.aiProvider){
    updateAISelector();
    el.aiProvider.addEventListener('change', function(){
      selectedProvider = this.value === 'openrouter' ? 'openrouter' : 'gemini';
      localStorage.setItem(PROVIDER_KEY, selectedProvider);
      updateAISelector();
      updateModeSelector();
      el.input.focus();
    });
  }

  if(el.modeSelector){
    updateModeSelector();
    el.modeSelector.addEventListener('change', function(){
      selectedMode = this.value === 'image' ? 'image' : 'chat';
      localStorage.setItem(MODE_KEY, selectedMode);
      updateModeSelector();
      el.input.focus();
    });
  }

  el.form.addEventListener('submit', function(e){
    e.preventDefault();
    if(isSending) return;
    var text = el.input.value.trim();
    if(!text) return;
    el.input.value = '';
    autoResize();
    sendMessage(text);
  });

  el.input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      if(isSending) return;
      if(el.form.requestSubmit){
        el.form.requestSubmit();
      }else{
        el.form.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    }
  });

  el.input.addEventListener('input', autoResize);

  el.clearBtn.addEventListener('click', function(){
    el.confirmOverlay.hidden = false;
  });

  el.cancelClear.addEventListener('click', function(){
    el.confirmOverlay.hidden = true;
  });

  el.confirmClear.addEventListener('click', function(){
    history = [];
    saveHistory();
    el.messages.innerHTML = '';
    toggleEmptyState();
    el.confirmOverlay.hidden = true;
  });

  el.confirmOverlay.addEventListener('click', function(e){
    if(e.target === el.confirmOverlay){
      el.confirmOverlay.hidden = true;
    }
  });

  window.addEventListener('online', updateConnectionStatus);
  window.addEventListener('offline', updateConnectionStatus);

  function init(){
    toggleEmptyState();
    history.forEach(function(m){
      createBubble(m.role, m.content);
    });
    updateConnectionStatus();
    scrollToBottom(false);
    el.input.focus();
  }

  init();
})();
</script>
</body>
</html>
